[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassava"
version = "0.1.0"
description = "Research framework: classical CV + CNN for cassava leaf disease classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "PyWavelets>=1.5",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
